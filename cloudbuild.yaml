# ── NextLane AI — Cloud Build Pipeline ───────────────────────────────────────
# Builds and deploys the FastAPI backend to Google Cloud Run.
#
# Setup:
#   1. gcloud auth login
#   2. gcloud config set project YOUR_PROJECT_ID
#   3. gcloud builds submit --config cloudbuild.yaml .
#
# Or trigger automatically via Cloud Build GitHub integration.
# ─────────────────────────────────────────────────────────────────────────────

steps:
  # ── Step 1: Build Docker image ──────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/nextlane-ai-backend:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/nextlane-ai-backend:latest"
      - "-f"
      - "backend/Dockerfile"
      - "backend"

  # ── Step 2: Push image to Container Registry ───────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/nextlane-ai-backend"

  # ── Step 3: Deploy to Cloud Run ────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "nextlane-ai-backend"
      - "--image=gcr.io/$PROJECT_ID/nextlane-ai-backend:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--concurrency=80"
      - "--timeout=300s"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--set-env-vars=ENVIRONMENT=production,LOG_FORMAT=json"
      - "--update-secrets=GEMINI_API_KEY=nextlane-gemini-key:latest,JWT_SECRET=nextlane-jwt-secret:latest,EMAIL_USER=nextlane-email-user:latest,EMAIL_PASS=nextlane-email-pass:latest"

images:
  - "gcr.io/$PROJECT_ID/nextlane-ai-backend:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/nextlane-ai-backend:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_MEDIUM"

timeout: "600s"
